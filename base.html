<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aprenda atitudes sustentáveis com o Planeta Consciente.">
  <title>{% block title %}Planeta Consciente{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topo">
  <a class="marca" href="{{ url_for('inicio') }}">🌎 Planeta Consciente</a>
  <nav aria-label="Navegação principal">
    <a href="{{ url_for('inicio') }}">Início</a>
    <a href="{{ url_for('dicas') }}">Dicas</a>
    <a href="{{ url_for('desafios') }}">Desafios</a>
    <a href="{{ url_for('curiosidades') }}">Curiosidades</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>
  <p>Pequenas atitudes, grandes mudanças. 💚</p>
  <small>Projeto educativo de conscientização ambiental.</small>
</footer>
</body>
</html>
